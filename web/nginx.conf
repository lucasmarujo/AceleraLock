server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # sendfile/cache abertos servem o inode antigo depois de uma edição no
    # bind mount — sem isto o hot reload nao ve a alteracao.
    sendfile off;
    open_file_cache off;
    etag on;
    add_header Cache-Control "no-store" always;

    location ~* \.(ya?ml|conf)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
