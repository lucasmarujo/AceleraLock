name: aceleralock-db

# Fora do ciclo de deploy de proposito: o deploy.sh nunca referencia este arquivo.
# Sobe uma vez, a mao, e fica. Azul e verde falam com este mesmo Postgres ao mesmo
# tempo — e por isso que toda migration e expand-only (ver infra/README.md).
services:
  postgres:
    image: postgres:17-alpine
    container_name: aceleralock-postgres
    restart: unless-stopped
    env_file: /srv/aceleralock/.env
    environment:
      POSTGRES_DB: aceleralock
      POSTGRES_USER: aceleralock
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /srv/aceleralock/pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aceleralock -d aceleralock"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aceleralock

networks:
  aceleralock:
    external: true
