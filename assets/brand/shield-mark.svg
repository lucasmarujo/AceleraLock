<!--
  Mark do AceleraLock. Mesma silhueta do ícone "shield" da família Feather
  (@expo/vector-icons, já em uso no app — família única, ver §5 da doc) —
  reaproveitada de propósito para o mark do produto não divergir do ícone
  que aparece dentro das próprias telas.

  Fonte: viewBox/path do "shield" do Feather (feathericons.com, MIT),
  fechado e preenchido em vez de traçado (fill em vez de stroke) — em
  tamanho pequeno (ícone de app, drawable de notificação) um preenchimento
  sólido lê melhor que um traço de 2px.

  Cor: currentColor de propósito — quem usa define a cor via `fill` no
  elemento pai/consumidor. As duas cores válidas do sistema (nunca outra):
  `#03c3bf` (turquesa, sobre fundo escuro) ou `#04141c` (quase-preto, sobre
  fundo claro) — docs/design-system.md §1.1/§1.2, "a cor que contrasta com
  o fundo, nunca a mesma nos dois temas".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
</svg>
