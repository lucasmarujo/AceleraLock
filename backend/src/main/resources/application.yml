spring:
  application:
    name: aceleralock-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aceleralock}
    username: ${DB_USERNAME:aceleralock}
    password: ${DB_PASSWORD:aceleralock}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-message: never

aceleralock:
  auth:
    bootstrap-token-ttl: 5m
    access-token-ttl: 15m
    refresh-token-ttl: 60d
    providers:
      APPLE:
        issuer: https://appleid.apple.com
        jwk-set-uri: https://appleid.apple.com/auth/keys
        audience: ${APPLE_AUDIENCE:}
      GOOGLE:
        issuer: https://accounts.google.com
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        audience: ${GOOGLE_AUDIENCE:}
  unlock:
    unilateral-cooldown: 48h
    grant-duration: 15m
    partner-min-age: 48h
    invite-ttl: 24h
    clock-skew-threshold: 60s
    refresh-grace: 30s
    default-cooldown-minutes: 30
    max-devices-per-account: 3
    failsafe-days: 7

logging:
  level:
    org.springframework.security: INFO
