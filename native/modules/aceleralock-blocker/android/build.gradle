apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.aceleralock.blocker'
version = '0.1.0'

android {
    namespace 'com.aceleralock.blocker'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':aceleralock-blocker-core')
    implementation 'expo.modules:expo-modules-core:+'
}
